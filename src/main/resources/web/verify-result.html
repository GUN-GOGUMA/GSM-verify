<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSM-Verify</title>
<style>
  :root {
    color-scheme: light dark;
    --bg-gradient: radial-gradient(circle at 20% 20%, #2a2f4a 0%, #14172a 45%, #0a0c18 100%);
    --card-border: rgba(255, 255, 255, 0.16);
    --card-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    --headline-color: #f5f6fa;
    --detail-color: rgba(235, 236, 245, 0.62);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg-gradient: radial-gradient(circle at 20% 20%, #f4f6fb 0%, #e7eaf3 45%, #dde1ec 100%);
      --card-border: rgba(20, 23, 42, 0.12);
      --card-shadow: 0 24px 60px rgba(20, 23, 42, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      --headline-color: #14172a;
      --detail-color: rgba(20, 23, 42, 0.62);
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
    background: var(--bg-gradient);
  }

  .card {
    position: relative;
    width: min(380px, 100%);
    padding: 48px 32px 40px;
    border-radius: 28px;
    text-align: center;
    border: 1px solid var(--card-border);
    box-shadow: var(--card-shadow);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%);
  }

  .icon-wrap {
    width: 88px;
    height: 88px;
    margin: 0 auto 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, %%ACCENT_START%%, %%ACCENT_END%%);
    box-shadow: 0 12px 28px %%ACCENT_SHADOW%%;
  }

  .icon-wrap svg {
    width: 42px;
    height: 42px;
  }

  .headline {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--headline-color);
    letter-spacing: -0.01em;
  }

  .detail {
    margin: 12px 0 0;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--detail-color);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      %%ICON_SVG%%
    </div>
    <h1 class="headline">%%HEADLINE%%</h1>
    <p class="detail">%%DETAIL%%</p>
  </div>
</body>
</html>
